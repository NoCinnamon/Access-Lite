<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Lite | Admin Login</title>
    
    <script>
    // REVERSE LOGIC: If they ALREADY have a token, skip login and go to dashboard
    if (localStorage.getItem('adminToken')) {
        window.location.href = 'index.html';
    }
    </script>
    
    <style>
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background: #2c3e50; /* Professional dark blue */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-container { 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
            text-align: center;
            width: 320px;
        }
        h2 { color: #333; margin-bottom: 20px; }
        input { 
            display: block; 
            width: 100%; 
            margin: 10px 0; 
            padding: 12px; 
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box; 
        }
        button { 
            width: 100%; 
            padding: 12px; 
            background: #3498db; 
            color: white; 
            border: none; 
            border-radius: 6px;
            cursor: pointer; 
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover { background: #2980b9; }
        #error-msg { color: #e74c3c; font-size: 0.9em; margin-top: 10px; }
    </style>
</head>

<body>
   <div class="login-container">
        <h1 style="color: #2c3e50; margin-bottom: 20px; font-weight: 800;">Access Lite</h1>
        <h2 style="color: #7f8c8d; font-size: 1.2em; margin-bottom: 30px;">Admin Login</h2>
        
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Sign In</button>
        <p id="error-msg"></p>
    </div>

    <script>
        async function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });

                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    // Save Token AND Username
                    localStorage.setItem('adminToken', data.token);
                    localStorage.setItem('adminUsername', data.username); 
                    
                    window.location.href = 'index.html'; 
                } else {
                    errorMsg.innerText = data.error || "Login failed";
                }
            } catch (err) {
                errorMsg.innerText = "Connection error. Is the server running?";
            }
        }
    </script>
</body>
</html>
